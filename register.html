<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Admin - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 p-3" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <h3 class="text-center mb-2"> Perpustakaan</h3>
            <p class="text-center text-secondary mb-4">Daftar Admin</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username"
                        class="form-control" autocomplete="username"
                        value="{{ request.form.get('username', '') }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password"
                        class="form-control" autocomplete="new-password"
                        minlength="8" required>
                    <div class="form-text">Minimal 8 karakter.</div>
                </div>

                <div class="mb-4">
                    <label for="konfirmasi_password" class="form-label">
                        Konfirmasi Password
                    </label>
                    <input type="password" id="konfirmasi_password"
                        name="konfirmasi_password" class="form-control"
                        autocomplete="new-password" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Daftar
                </button>
            </form>

            <p class="text-center text-secondary mt-3 mb-0">
                Sudah punya akun?
                <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
