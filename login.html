<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Admin - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 p-3" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <h3 class="text-center mb-2"> Library Online</h3>
            <p class="text-center text-secondary mb-4">Login Admin</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control"
                        autocomplete="username" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" class="form-control"
                            autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button"
                                id="togglePassword" aria-controls="password" aria-pressed="false">
                            Tampilkan
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Login
                </button>
            </form>
            <p class="text-center text-secondary mt-3 mb-0">
                Belum punya akun admin?
                <a href="{{ url_for('register') }}">Daftar</a>
            </p>
        </div>
        <div class="text-center mt-2">
                    <small><a href="{{ url_for('index') }}" class="text-muted">Kembali ke Beranda Utama</a></small>
                </div>
    </div>
</div>
<script>
    const passwordInput = document.getElementById("password");
    const togglePasswordButton = document.getElementById("togglePassword");

    togglePasswordButton.addEventListener("click", () => {
        const isPasswordHidden = passwordInput.type === "password";
        passwordInput.type = isPasswordHidden ? "text" : "password";
        togglePasswordButton.textContent = isPasswordHidden ? "Sembunyikan" : "Tampilkan";
        togglePasswordButton.setAttribute("aria-pressed", String(isPasswordHidden));
    });
</script>
</body>
</html>
